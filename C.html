<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站建设中 / Under Construction</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto+Mono&family=Space+Grotesk:wght@300;700&family=Oswald:wght@400;700&family=Bebas+Neue&family=Inconsolata:wght@400;700&family=Major+Mono+Display&family=Quicksand:wght@400;700&family=Anton&family=Abril+Fatface&family=Permanent+Marker&family=Press+Start+2P&family=Monoton&display=swap" rel="stylesheet">

    <style>
        /* 基础样式重置 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 页面背景及居中布局 */
        body {
            background-image: url('https://artwork.neocities.org/bgs/new/pat03.gif');
            background-attachment: fixed;
            background-size: auto;
            font-family: 'Press Start 2P', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #333333;
            /* 网页固定，不让滚动 */
            overflow: hidden; 
        }

        /* 内容容器 */
        .container {
            text-align: center;
            max-width: 100%;
            /* 🌟 将整体内容向上方移动一点点 (根据需要可修改 -10vh 的大小) */
            transform: translateY(-2.5vh); 
        }

        /* GIF图片样式（响应式缩放） */
        .gif-image {
            max-width: 280px;
            width: 100%;
            height: auto;
            margin-bottom: 20px;
            display: inline-block;
        }

        /* 打字机外部容器：确保打字时整体始终保持居中 */
        .typewriter-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 12px;
        }

        /* 中文文本样式 - 2. 打字机效果 (包含...) */
        .title-cn {
            font-size: 1.5rem; /* 像素字体偏大，稍微调小一点保持协调 */
            color: #2c3e50;
            
            /* 打字机核心样式 */
            overflow: hidden;
            white-space: nowrap;
            border-right: 3px solid #2c3e50; /* 模拟光标 */
            
            /* 设定终点宽度：5个汉字约5em，3个像素点约1.8em，总计约 6.8em */
            width: 6.8em; 
            
            /* typing控制字数宽度，一共8个字符所以使用 steps(8) */
            animation: 
                typing 4.5s steps(8, end) infinite,
                blink .75s step-end infinite;
        }

        /* 打字机动画关键帧 */
        @keyframes typing {
            0%, 15% { width: 0; }                 /* 初始隐藏并停顿 */
            45%, 75% { width: 12.8em; }
            90%, 100% { width: 0; }               /* 快速删回 0 */
        }

        /* 光标闪烁关键帧 */
        @keyframes blink {
            from, to { border-color: transparent; }
            50% { border-color: #2c3e50; }
        }

        /* 英文文本样式 */
        .title-en {
            font-size: 0.8rem; /* 像素字体较宽，缩小字号 */
            color: #7f8c8d;
            letter-spacing: 1px;
            line-height: 1.5;
        }

        /* 针对小屏幕设备的微调 */
        @media (max-width: 480px) {
            .gif-image {
                max-width: 200px;
            }
            .title-cn {
                font-size: 1.2rem;
            }
            .title-en {
                font-size: 0.6rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <img class="gif-image" src="https://raw.githubusercontent.com/me2077/me2077.github.io/main/images/neko-web.gif" alt="Website Under Construction">
        
        <div class="typewriter-wrapper">
            <div class="title-cn">网站建设中,不知猴年马月!</div>
        </div>
        
        <div class="title-en">WEBSITE UNDER CONSTRUCTION</div>
    </div>

<script>
// 3. 光标跟随 Emoji 效果脚本 (保持不变)
(function emojiCursor() {

    var possibleEmoji = [
        "😊","🥺","💙","🥰","⭐","🌈","❤","🧡","💛","💚","💜",
        "🏳️‍🌈","⚧","⌘","^^",":)","(^◡^)","≧◠‿◠≦"
    ];

    var particles = [];
    var cursor = { x: 0, y: 0 };
    var lastTime = 0;

    function init() {
        bindEvents();
        loop();
    }

    function bindEvents() {
        document.addEventListener('pointermove', onPointerMove, { passive: true });
        window.addEventListener('resize', onResize);
    }

    function onResize() {}

    function onPointerMove(e) {
        const now = Date.now();

        // 🔥 控制频率，避免手机卡顿
        if (now - lastTime < 18) return;
        lastTime = now;

        cursor.x = e.clientX;
        cursor.y = e.clientY;

        addParticle(
            cursor.x,
            cursor.y + window.scrollY,
            possibleEmoji[Math.floor(Math.random() * possibleEmoji.length)]
        );
    }

    function addParticle(x, y, character) {
        var particle = new Particle();
        particle.init(x, y, character);
        particles.push(particle);
    }

    function updateParticles() {
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            if (particles[i].lifeSpan < 0) {
                particles[i].die();
                particles.splice(i, 1);
            }
        }
    }

    function loop() {
        requestAnimationFrame(loop);
        updateParticles();
    }

    function Particle() {

        this.lifeSpan = 100;

        this.init = function(x, y, character) {

            this.velocity = {
                x: (Math.random() - 0.5) * 1.2,
                y: 1
            };

            this.position = {
                x: x,
                y: y
            };

            this.element = document.createElement('span');
            this.element.innerHTML = character;

            this.element.style.position = "fixed";
            this.element.style.left = "0";
            this.element.style.top = "0";
            this.element.style.pointerEvents = "none";
            this.element.style.zIndex = "999999";
            this.element.style.fontSize = "16px";
            this.element.style.willChange = "transform";

            document.body.appendChild(this.element);

            this.update();
        };

        this.update = function() {
            this.position.x += this.velocity.x;
            this.position.y += this.velocity.y;
            this.lifeSpan--;

            const scale = this.lifeSpan / 100;

            this.element.style.transform =
                `translate3d(${this.position.x}px, ${this.position.y}px, 0) scale(${scale})`;
        };

        this.die = function() {
            this.element.remove();
        };
    }

    init();

})();
</script>
</body>
</html>
