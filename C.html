<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站建设中 / Under Construction</title>
    <style>
        /* 基础样式重置 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 页面背景及居中布局 */
        body {
            background-color: #ececec;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #333333;
        }

        /* 内容容器 */
        .container {
            text-align: center;
            max-width: 100%;
        }

        /* GIF图片样式（响应式缩放） */
        .gif-image {
            max-width: 280px;
            width: 100%;
            height: auto;
            margin-bottom: 20px;
            display: inline-block;
        }

        /* 中文文本样式 */
        .title-cn {
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #2c3e50;
        }

        /* 英文文本样式 */
        .title-en {
            font-size: 1.1rem;
            color: #7f8c8d;
            letter-spacing: 1px;
        }

        /* 针对小屏幕设备的微调 */
        @media (max-width: 480px) {
            .gif-image {
                max-width: 200px;
            }
            .title-cn {
                font-size: 1.4rem;
            }
            .title-en {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- GIF 图片 -->
        <img class="gif-image" src="https://media3.giphy.com/media/80dIUvgluhCGuHKjBP/giphy.gif?cid=9b38fe9169740788c9d9944605b5f42a2f0dca7f7abbf699&ep=v1_user_favorites&rid=giphy.gif&ct=s" alt="Website Under Construction">
        
        <!-- 中英文文字 -->
        <div class="title-cn">网站建设中</div>
        <div class="title-en">Website Under Construction</div>
    </div>

</body>
</html>
