<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在加载网页标题...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
            color: #333;
        }
        .container {
            text-align: center;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            max-width: 500px;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            line-height: 1.6;
        }
        .badge {
            display: inline-block;
            background-color: #eef2f5;
            color: #4a5568;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ooo</h1>
    </div>

    <script>
        // ================= 参数配置区域 =================
        // 1. 需要轮播显示的文本数组
        const messages = [
            "👋 欢迎光临我的网站！",
            "🚀 专注提供优质内容",
            "✨ 记得收藏本页哦～",
            "📩 欢迎随时联系我们"
        ];

        const typingSpeed = 150;     // 打字速度 (毫秒/字)
        const delayBetween = 2000;   // 单条消息展示完成后的停顿时间 (毫秒)
        const isInfinite = true;     // 是否无限循环 (true 为无限循环, false 为固定次数)
        const repeatCount = 3;       // 当 isInfinite 为 false 时，控制循环总轮数
        // ===============================================

        let currentMsgIdx = 0; // 当前消息索引
        let currentCharIdx = 0; // 当前字符索引
        let currentLoop = 1;   // 当前循环轮次

        function typeTitle() {
            const currentMessage = messages[currentMsgIdx];
            
            // 截取当前需要显示的字符串并更新标题
            document.title = currentMessage.substring(0, currentCharIdx + 1);
            
            currentCharIdx++;
            let nextDelay = typingSpeed;

            // 当整条消息打印完毕
            if (currentCharIdx >= currentMessage.length) {
                currentCharIdx = 0;
                currentMsgIdx++;
                nextDelay = delayBetween; // 设置消息停顿间隔
            }

            // 当所有消息都打印一轮完毕
            if (currentMsgIdx >= messages.length) {
                // 如果非无限循环，且达到了设定轮数，则停止脚本
                if (!isInfinite && currentLoop >= repeatCount) {
                    return; 
                }
                currentLoop++;
                currentMsgIdx = 0;
            }

            // 递归调用
            setTimeout(typeTitle, nextDelay);
        }

        // 页面加载完成后自动启动
        window.onload = typeTitle;
    </script>

</body>
</html>
