<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Chattable</title>

  <script src="https://iframe.chat/scripts/main.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background-color: #c7b6ce;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #chattable {
      display: block;

      /* 根据屏幕宽度自动调整 */
      width: min(100vw, 500px);

      /* 保持原来的 335:445 比例 */
      aspect-ratio: 335 / 445;

      height: auto;

      border: none;
    }

    /* 手机 */
    @media (max-width: 600px) {
      #chattable {
        width: 100vw;
        height: 100dvh;
        aspect-ratio: auto;
      }
    }

    /* 平板 */
    @media (min-width: 601px) and (max-width: 1024px) {
      #chattable {
        width: min(80vw, 500px);
        height: min(90dvh, 665px);
      }
    }
  </style>
</head>

<body>

  <iframe
    src="https://iframe.chat/embed?chat=20777777"
    id="chattable">
  </iframe>

  <script>
    chattable.initialize({
      stylesheet: "https://raw.githubusercontent.com/KiwiMeowo/kiwimeowo/refs/heads/main/public/chattable/sunset.css"
    });
  </script>
</body>
</html>
