<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GitHub 文件加速</title>
<style>
/* 2. 修改了 body 的高度设置 */
*{box-sizing:border-box}
body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    /* 兼容老版本浏览器 */
    min-height:100vh;
    /* 完美适配 Safari 动态地址栏 */
    min-height:100dvh; 
    display:grid;
    place-items:center;
    background:#3e3e3e;
    color:#fff;
    overflow:hidden;
    /* 可选：如果你担心小屏幕下内容碰到刘海，可以加上安全区内边距，但当前居中布局基本不需要 */
    /* padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); */
}
.card{width:min(92vw,720px);padding:40px;border-radius:28px;background:rgba(255,255,255,.08);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.12);box-shadow:0 20px 60px rgba(0,0,0,.4)}
h1{margin:0 0 10px;font-size:40px}.sub{color:#b8c2d8;margin:0 0 28px}
.wrap{display:flex;gap:14px;flex-wrap:wrap}
input{flex:1;min-width:260px;padding:18px 20px;border-radius:16px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#fff;font-size:16px}
input:focus{outline:none;border-color:#7c8cff;box-shadow:0 0 0 4px #7c8cff33}
button{padding:18px 28px;border:0;border-radius:16px;background:linear-gradient(135deg,#6d7cff,#8f5cff);color:#fff;font-weight:700;cursor:pointer;transition:.25s}
button:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(109,124,255,.4)}
.note{margin-top:18px;color:#9fb0cf;font-size:14px}

@media (max-width: 600px) {
  button {
    width: 100%;
  }
}
</style>
<script>
function toSubmit(e){e.preventDefault();const q=document.getElementsByName('q')[0].value.trim();window.open(location.href.substr(0,location.href.lastIndexOf('/')+1)+q);}
</script>
</head>
<body><div class="card">
<h1>GitHub Proxy</h1><p class="sub">快速生成 GitHub 文件加速下载链接</p>
<form onsubmit="toSubmit(event)">
<div class="wrap">
<input name="q" placeholder="粘贴 GitHub 文件链接..."
pattern="^((https|http):\/\/)?(github\.com\/.+?\/.+?\/(?:releases|archive|blob|raw|suites)|((?:raw|gist)\.(?:githubusercontent|github)\.com))\/.+$" required>
<button>Download</button></div></form>
<div class="note">支持 Releases、Archive、Blob、Raw 等 GitHub 文件链接。</div>
</div></body>
</html>
