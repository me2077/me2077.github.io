<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GSAP Flip Scroll Animation</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#111;
    color:#fff;
}

.hero{
    overflow:hidden;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.content{
    position:relative;
    z-index:1;
}

.top-line{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
}

.top-line h1,
.bottom-line h1{
    font-size:clamp(48px,8vw,120px);
    font-weight:700;
    line-height:1;
    white-space:nowrap;
}

.img-small{
    width:150px;
    height:90px;
    padding:0 10px;
}

.img-small .inner{
    width:100%;
    height:100%;
}

.img-small img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.bottom-line{
    margin-top:10px;
    text-align:center;
}

.full-screen{
    position:fixed;
    inset:0;
    width:100%;
    height:100vh;
    z-index:2;
    pointer-events:none;
}

.img-container{
    overflow:hidden;
    width:100%;
    height:100%;
}

.img-container img{
    width:100%;
    height:100%;
    object-fit:cover;
}
</style>
</head>
<body>

<section class="hero">
    <div class="content">
        <div class="top-line">
            <h1>Lorem</h1>

            <div class="img-small">
                <div class="inner"></div>
            </div>

            <h1>Ipsum</h1>
        </div>

        <div class="bottom-line">
            <h1>Dolor sit amet</h1>
        </div>
    </div>
</section>

<div class="full-screen">
    <div class="img-container">
        <img src="https://assets.codepen.io/16327/gsap-modern-bg.png" alt="">
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/Flip.min.js"></script>

<script>
gsap.registerPlugin(ScrollTrigger, Flip);

const smallImgContainer = document.querySelector(".hero .img-small .inner");
const targetImg = document.querySelector(".full-screen .img-container");

const resizeTimer = gsap.delayedCall(0.2, init).pause();

let ctx;

function init(){

    if(ctx){
        ctx.revert();
    }

    ctx = gsap.context(()=>{

        const flip = Flip.fit(targetImg, smallImgContainer,{
            duration:1,
            ease:"none"
        }).pause();

        const tl = gsap.timeline({
            scrollTrigger:{
                trigger:".hero",
                start:"top top",
                end:"+=100%",
                pin:true,
                scrub:true
            }
        });

        tl.add(flip.play())

        .from(".top-line h1",{
            xPercent:(i)=> i ? 250 : -250,
            ease:"power1.in"
        },"0.5")

        .from(".bottom-line h1",{
            y:200,
            ease:"power1.in"
        },"<");

    });

}

init();

window.addEventListener("resize",()=>{
    resizeTimer.restart(true);
});
</script>

</body>
</html>
